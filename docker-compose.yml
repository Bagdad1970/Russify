services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=md5
      - POSTGRES_INITDB_ARGS=--auth=md5
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d password" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-15532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}

  minio-buckets:
    image: quay.io/minio/mc:latest
    container_name: minio-client
    depends_on:
      - minio
    restart: on-failure
    volumes:
      - ../music:/seed-music:ro
      - ./scripts/seed-minio-media.sh:/seed-minio-media.sh:ro
    entrypoint: ["/bin/sh", "/seed-minio-media.sh"]

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: RussifyService/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/postgres}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-miniopassword}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_MEDIA_BASE_URL: ${VITE_MEDIA_BASE_URL:-http://localhost:9000}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:8080}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,russify.k-lab.su}
      VITE_PORT: ${VITE_PORT:-5173}

volumes:
  postgres_data:
  minio-data:
