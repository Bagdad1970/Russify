spring:
  datasource:
    url: jdbc:postgresql://localhost:15532/postgres
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none    # У нас схемой управлять будет liquibase так что вот так вот
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog.xml
    default-schema: public
    enabled: true

app:
  schemas: liquibase, app